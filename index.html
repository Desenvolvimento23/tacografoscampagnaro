    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "mainEntity": [
                {
                    "@type": "Question",
                    "name": "Por que a aferição do tacógrafo é obrigatória?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "A aferição é obrigatória por lei, conforme Resoluções do CONTRAN e Portarias do INMETRO. Normalmente deve ser realizada a cada dois anos ou após reparos no equipamento."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Como iniciar o processo de aferição?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Consulte a placa no site do INMETRO, preencha os dados, gere a GRU e realize o pagamento. A compensação pode levar até 24 horas."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Como faço o agendamento?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Depois da compensação da GRU, entre em contato com a Campagnaro Truck Center pelo WhatsApp (54) 3232-7422 para escolher o horário."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Por quanto tempo o resultado é válido?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Após a aprovação, o resultado da verificação do tacógrafo é válido por dois anos. Uma nova aferição também pode ser necessária depois de reparos no equipamento."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Onde consulto o resultado da aferição?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "O resultado fica disponível para consulta no site Cronotacógrafo após a conclusão do processo."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Quais veículos precisam de tacógrafo aferido?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Entre os veículos obrigatórios estão os de transporte coletivo com mais de dez lugares, escolares, veículos de carga com PBT acima de 4.536 kg e veículos com CMT igual ou superior a 19 toneladas."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Quais são os riscos de circular sem a aferição válida?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "O veículo pode receber multa grave conforme o Art. 230 do CTB, gerar pontos na CNH, ser retido e ainda sofrer sanções do INMETRO."
                    }
                }
            ]
